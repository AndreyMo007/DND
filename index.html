<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Кубик и Судьба — ИИ-Мастер</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0e0f13;color:#e8e6e3;overscroll-behavior:none}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:720px;margin:0 auto}
  header{padding:10px 14px;background:#15171d;border-bottom:1px solid #242833;display:flex;align-items:center;gap:8px;flex-shrink:0}
  header h1{font-size:14px;margin:0;font-weight:700;letter-spacing:.4px;color:#c9b47a}
  .badge{font-size:11px;padding:2px 8px;border-radius:10px;background:#242833;color:#8b93a3;margin-left:auto}
  .badge.online{background:#1a2a1e;color:#4caf50}
  .badge.offline{background:#2a1a1a;color:#e05a5a}
  #log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
  .msg{padding:10px 13px;border-radius:12px;line-height:1.5;font-size:14.5px;white-space:pre-wrap;word-wrap:break-word;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg.narrator{background:#1a1d26;border-left:3px solid #c9b47a}
  .msg.system{background:#15171d;color:#8b93a3;font-size:13px;font-style:italic;text-align:center}
  .msg.player{background:#1e2a3a;align-self:flex-end;max-width:88%;border-right:3px solid #4a8fff}
  .msg.dice{background:#2a1e1a;text-align:center;font-weight:700;color:#ffb04a;border:1px solid #4a3320;font-size:15px}
  .msg.good{background:#1a2a1e;border-left:3px solid #4caf50}
  .msg.bad{background:#2a1a1a;border-left:3px solid #e05a5a}
  .msg.title{background:transparent;text-align:center;color:#c9b47a;font-size:19px;font-weight:800;letter-spacing:.6px;padding:20px 0 8px}
  .msg.thinking{background:#15171d;color:#c9b47a;font-style:italic;text-align:center;font-size:13px}
  .name{font-size:11px;color:#7a8394;display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.6px}
  footer{padding:10px 12px;background:#15171d;border-top:1px solid #242833;display:flex;gap:8px;align-items:flex-end;flex-shrink:0}
  #input{flex:1;background:#0e0f13;border:1px solid #2a2f3c;border-radius:12px;padding:11px 13px;color:#e8e6e3;font-size:15px;font-family:inherit;resize:none;min-height:44px;max-height:110px;outline:none}
  #input:focus{border-color:#c9b47a}
  button{background:#c9b47a;color:#0e0f13;border:none;padding:12px 18px;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit}
  button:active{transform:scale(.97)}
  button:disabled{opacity:.4}
  .choices{display:flex;flex-direction:column;gap:8px;padding:0 14px 14px}
  .choice{background:#1a1d26;border:1px solid #2a2f3c;border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;color:#e8e6e3;font-size:14px;font-family:inherit}
  .choice:active{background:#242833}
  .choice .rname{font-weight:800;color:#c9b47a;font-size:15px}
  .choice .rdesc{font-size:12px;color:#8b93a3;margin-top:4px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px 14px}
  .pbtn{padding:16px 0;font-size:18px;text-align:center}
  .rollBtn{background:#c9b47a;color:#0e0f13;padding:14px;font-size:15px;margin:0 14px 14px;width:calc(100% - 28px)}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🎲 КУБИК И СУДЬБА</h1>
    <span class="badge" id="phaseBadge">ИИ-Мастер</span>
    <span class="badge" id="netBadge">проверка...</span>
  </header>
  <div id="log"></div>
  <div id="choices" class="choices" style="display:none"></div>
  <footer id="footer" style="display:none">
    <textarea id="input" rows="1" placeholder="Что ты делаешь? Или спроси мастера..."></textarea>
    <button id="sendBtn">➤</button>
  </footer>
</div>
<script>
/* =====================================================================
   КУБИК И СУДЬБА — онлайн-версия с ИИ-Мастером на Cloudflare Workers AI
   ===================================================================== */

const PROXY_URL = 'https://igra-master-proxy.andreymomot007.workers.dev';

/* ---------- УТИЛИТЫ ---------- */
const $ = s => document.querySelector(s);
const ri = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const die = s => ri(1,s);
const rnd = a => a[Math.floor(Math.random()*a.length)];

/* ---------- БАНКИ СЛУЧАЙНОСТЕЙ (чтобы сюжет не повторялся) ---------- */
const GENRES = [
  'тёмное фэнтези','космическая одиссея','хоррор-детектив','постапокалипсис',
  'стимпанк','пиратское приключение','киберпанк','славянское фэнтези',
  'вестерн с магией','мифическая Япония','альтернативная история',
  'подводный мир','городской детектив','психоделический сюрреализм',
  'доисторические времена','шпионский триллер','fantasy-нуар',
  'пустынный караван','ледяная экспедиция','джунгли древних богов'
];

const MOODS = [
  'мрачная и тревожная','лёгкая и юмористическая','эпическая и героическая',
  'загадочная и мистическая','жестокая и безжалостная','ироничная и циничная',
  'меланхоличная и лиричная','безумная и абсурдная','напряжённая как триллер',
  'тёплая и душевная','холодная и отстранённая','безнадёжная и давящая'
];

const HOOKS = [
  'все игроки очнулись в незнакомом месте без памяти',
  'один из игроков получает письмо от человека, который давно умер',
  'земля начала шептать — только вы это слышите',
  'каждую ночь пропадает по одному жителю ближайшего поселения',
  'в небе появилась вторая луна, и никто, кроме вас, её не видит',
  'ваш отряд получил заказ, от которого отказались все остальные',
  'вы должны спасти ребёнка, который ещё не родился',
  'найденный артефакт оказался живым и говорит с вами',
  'все дороги ведут в одно место, которого нет на картах',
  'вы выиграли билет в место, которого не должно существовать',
  'ваш дом исчез, оставив только ровный круг пепла',
  'вы получили власть, о которой не просили, и она требует плату',
  'кто-то украл ваши тени',
  'один из вас — не тот, за кого себя выдаёт, и он сам этого не знает'
];

const TWISTS = [
  'союзник окажется врагом, а враг — единственным, кто может спасти',
  'всё, что происходит — уже происходило раньше, много раз',
  'настоящий злодей — сама реальность',
  'один из игроков должен пожертвовать собой в финале',
  'то, что вы ищете, ищет вас',
  'ваша цель была ложной с самого начала',
  'время течёт в этом месте вспять',
  'есть третий вариант, о котором никто не думал'
];

const SEEDS = [
  'запах мокрой шерсти','звук детской считалки','разбитое зеркало','письмо без подписи',
  'железный ключ','клетка с пустотой внутри','карта без названий','шрам в форме звезды',
  'монета, которая всегда падает орлом','зерно, которое не прорастает','белая ворона',
  'книга без первой страницы','песня без слов','дверь без стены','часы, идущие назад',
  'вышивка с чужой подписью','фотография, где все лица размыты','кукла без глаз'
];

/* ---------- СОСТОЯНИЕ ---------- */
const S = {
  online: navigator.onLine,
  phase: 'start',
  numPlayers: 0,
  players: [],
  history: [],
  pendingCheck: null,
  pendingRoleFor: null,
  currentTurn: 0,
  busy: false,
};

/* ---------- UI ---------- */
function addMsg(text, cls='narrator', name=''){
  const log = $('#log');
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  if (name) {
    const n = document.createElement('span');
    n.className = 'name';
    n.textContent = name;
    el.appendChild(n);
  }
  el.appendChild(document.createTextNode(text));
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}
function clearChoices(){ const c=$('#choices'); c.innerHTML=''; c.style.display='none'; }
function showChoices(items){
  clearChoices();
  const c = $('#choices'); c.style.display = 'flex';
  items.forEach(it => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = it.html;
    b.onclick = () => { clearChoices(); it.onClick(); };
    c.appendChild(b);
  });
}
function showFooter(v){ $('#footer').style.display = v ? 'flex' : 'none'; }
function setPhase(p, badge){ S.phase = p; $('#phaseBadge').textContent = badge || p; }

function updateNetBadge(){
  const b = $('#netBadge');
  if (S.online) { b.textContent = 'ИИ онлайн'; b.className = 'badge online'; }
  else { b.textContent = 'офлайн'; b.className = 'badge offline'; }
}
window.addEventListener('online', () => { S.online=true; updateNetBadge(); });
window.addEventListener('offline', () => { S.online=false; updateNetBadge(); });

/* ---------- ВЫЗОВ LLM ЧЕРЕЗ ПРОКСИ ---------- */
async function callLLM(messages, maxTokens = 1500){
  if (!S.online) throw new Error('Нет подключения к интернету');
  const res = await fetch(PROXY_URL, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ messages, max_tokens: maxTokens }),
  });
  if (!res.ok) {
    const errText = await res.text().catch(() => '');
    throw new Error('Ошибка ' + res.status + ': ' + errText);
  }
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return (data.choices?.[0]?.message?.content || '').trim();
}

/* ---------- СИСТЕМНЫЙ ПРОМПТ ---------- */
const SYSTEM_PROMPT = `Ты — Мастер настольной ролевой игры на одном телефоне для 2–6 игроков. Ты ведёшь живую историю в заданном жанре.

ПРАВИЛА:
1. Ты придумываешь место, цель, вступление и 6 ролей на выбор. Игроки выбирают роли по очереди.
2. После выбора ролей ты даёшь каждому 2–3 предмета и говоришь, что делать: бросить кубик на здоровье (d8–d12 в зависимости от роли), на удачу (d6) или на другую характеристику.
3. Каждый ход игрок пишет действие или вопрос. На вопросы отвечай кратко и по делу: сколько силы, здоровья, что в инвентаре, где вы находитесь.
4. Действия разрешай через проверки: «Брось d20 + Ловкость, сложность 12». Результат броска игрок сообщает тебе.
5. Веди историю через 5 актов: Начало → Путь → Тень → Кульминация → Развязка. Каждые 3 хода на игрока — новый акт с поворотом.
6. Пиши атмосферно, но коротко: 2–4 предложения на ответ. Не растекайся.
7. Никогда не говори «я не могу» или «я языковая модель». Ты — Мастер. Веди игру.
8. Если игрок пишет «бросок» или присылает результат d20 — опиши последствие.

ФОРМАТ ОТВЕТА: только текст Мастера, без markdown-заголовков и без пояснений от себя.`;

/* ---------- СТАРТ ---------- */
function startScreen(){
  setPhase('start','ИИ-Мастер');
  updateNetBadge();
  addMsg('🎲 КУБИК И СУДЬБА — ОНЛАЙН', 'title');
  addMsg('Один телефон. 2–6 игроков. Настоящий ИИ-Мастер, который сам придумывает сюжет, роли, события и отвечает на любые вопросы.', 'system');
  addMsg('Мастер сочинит историю с нуля: жанр, место, цель, 6 ролей. Вы выбираете роли по очереди, бросаете кубики, действуете и задаёте вопросы.', 'narrator');
  showChoices([
    {html:'<div class="rname">▶ Новая игра</div><div class="rdesc">Начать приключение с ИИ-Мастером</div>', onClick:askPlayers}
  ]);
}

/* ---------- ВЫБОР ЧИСЛА ИГРОКОВ ---------- */
function askPlayers(){
  setPhase('setup','Настройка');
  addMsg('Сколько вас за столом?', 'narrator');
  clearChoices();
  const c = $('#choices');
  c.className = 'grid';
  c.style.display = 'grid';
  c.innerHTML = '';
  [2,3,4,5,6].forEach(n => {
    const b = document.createElement('button');
    b.className = 'choice pbtn';
    b.textContent = n;
    b.onclick = () => { c.className='choices'; c.style.display='none'; startGame(n); };
    c.appendChild(b);
  });
}

/* ---------- СТАРТ ИГРЫ ---------- */
async function startGame(n){
  S.numPlayers = n;
  S.players = Array.from({length:n}, (_,i)=>({
    idx:i, name:'Игрок '+(i+1), role:null, hp:0, maxHp:0, items:[], stats:{}
  }));
  S.history = [{role:'system', content:SYSTEM_PROMPT}];

  addMsg(`Игра на ${n} игроков. Мастер придумывает мир...`, 'thinking');
  setPhase('intro','Мастер');

  // Случайные элементы — каждый раз новые
  const genre  = rnd(GENRES);
  const mood   = rnd(MOODS);
  const hook   = rnd(HOOKS);
  const twist  = rnd(TWISTS);
  const seed1  = rnd(SEEDS);
  const seed2  = rnd(SEEDS);
  const num    = Math.floor(Math.random()*100000);

  const userMsg =
`Партия №${num}.

Жанр: ${genre}.
Атмосфера: ${mood}.
Завязка: ${hook}.
Обязательный поворот в середине истории: ${twist}.
Творческие зёрна (обязательно вплети их как детали): «${seed1}» и «${seed2}».

Придумай:
1) Название истории (2–4 слова).
2) Место действия — конкретное, уникальное, не «лес» и не «замок».
3) Цель партии.
4) Вступление (2–4 предложения) — сразу с завязкой, без воды.
5) Шесть РАЗНЫХ ролей на выбор, у каждой: имя, короткое описание, 2–3 предмета.

ВАЖНО: не используй клише. Не начинай с таверны, незнакомца в плаще, «древнего артефакта», «тёмного лорда». Придумай что-то, чего игроки ещё не видели. Не пиши всё сразу — только название, место, цель, вступление и список ролей.`;
  S.history.push({role:'user', content:userMsg});

  try {
    const reply = await callLLM(S.history);
    S.history.push({role:'assistant', content:reply});
    addMsg(reply, 'narrator');
    askRoleForPlayer(0);
  } catch(e){
    addMsg('Не удалось связаться с ИИ-Мастером: ' + e.message, 'bad');
    addMsg('Если ты в России — включи VPN, домен workers.dev может быть заблокирован.', 'system');
  }
}

/* ---------- ВЫБОР РОЛИ ---------- */
function askRoleForPlayer(idx){
  if (idx >= S.numPlayers) { startStatsRolls(); return; }
  S.currentTurn = idx;
  setPhase('roles', `Роль ${idx+1}/${S.numPlayers}`);
  addMsg(`Игрок ${idx+1}, назови свою роль (например: «Я беру Воина»).`, 'system');
  showFooter(true);
  S.pendingRoleFor = idx;
}

/* ---------- БРОСКИ СТАТОВ ---------- */
async function startStatsRolls(){
  showFooter(false);
  setPhase('stats','Броски');
  addMsg('Мастер готовит броски на здоровье и удачу.', 'narrator');

  const roles = S.players.map(p=>`Игрок ${p.idx+1} — ${p.role}`).join('; ');
  const userMsg = `Все игроки выбрали роли: ${roles}. Скажи каждому игроку бросить кубик на здоровье (d8–d12 в зависимости от роли) и на удачу (d6). Напиши коротко, что кидать.`;
  S.history.push({role:'user', content:userMsg});

  try {
    const reply = await callLLM(S.history, 800);
    S.history.push({role:'assistant', content:reply});
    addMsg(reply, 'narrator');
  } catch(e){
    addMsg('Мастер молчит. Бросаем стандартные кубики.', 'system');
  }

  let i = 0;
  const step = () => {
    if (i >= S.players.length) {
      const summary = S.players.map(p =>
        `Игрок ${p.idx+1} (${p.role}): HP ${p.hp}/${p.maxHp}, удача ${p.stats.luck}, предметы: ${(p.items||[]).join(', ')}`
      ).join('\n');
      S.history.push({role:'user', content:`Результаты бросков:\n${summary}\nНачинай первый акт.`});
      setTimeout(startPlay, 600);
      return;
    }
    const p = S.players[i];
    const hpRoll = die(10);
    p.maxHp = hpRoll + 5;
    p.hp = p.maxHp;
    const luck = die(6);
    p.stats.luck = luck;
    addMsg(`🎲 Игрок ${p.idx+1} (${p.role}): здоровье d10 = ${hpRoll} → итого ${p.maxHp}. Удача d6 = ${luck}.`, 'dice');
    i++;
    setTimeout(step, 400);
  };
  step();
}

/* ---------- ОСНОВНОЙ ЦИКЛ ---------- */
async function startPlay(){
  setPhase('play','Игра');
  showFooter(true);
  S.currentTurn = 0;
  await narrateScene();
}

async function narrateScene(){
  if (S.busy) return;
  S.busy = true;

  try {
    const reply = await callLLM(S.history, 1000);
    S.history.push({role:'assistant', content:reply});
    addMsg(reply, 'narrator');
  } catch(e){
    addMsg('Мастер не ответил: ' + e.message, 'bad');
  }

  const p = S.players[S.currentTurn % S.players.length];
  addMsg(`Ход: ${p.name} (${p.role}). Что ты делаешь? Или задай вопрос.`, 'system');
  S.busy = false;
}

/* ---------- ОБРАБОТКА ВВОДА ---------- */
async function handleInput(){
  const input = $('#input');
  const text = input.value.trim();
  if (!text || S.busy) return;
  input.value = '';
  input.style.height = 'auto';

  const p = S.players[S.currentTurn % S.players.length];

  if (S.pendingRoleFor !== null && S.pendingRoleFor !== undefined) {
    const idx = S.pendingRoleFor;
    const player = S.players[idx];
    player.role = text;
    addMsg(text, 'player', player.name);
    S.history.push({role:'user', content:`Игрок ${idx+1} выбирает роль: ${text}. Подтверди коротко и перечисли 2–3 предмета, которые у него есть.`});
    S.pendingRoleFor = null;

    try {
      const reply = await callLLM(S.history, 500);
      S.history.push({role:'assistant', content:reply});
      addMsg(reply, 'narrator');
      const m = reply.match(/предмет[ыа]?[:\s]+([^\.\n]+)/i);
      player.items = m ? m[1].split(/[,;]/).map(s=>s.trim()).filter(Boolean) : ['небольшой нож','фляга','верёвка'];
      player.stats.str = ri(1,5);
      player.stats.agi = ri(1,5);
      player.stats.int = ri(1,5);
    } catch(e){
      addMsg('Мастер не ответил. Считаем, что роль принята.', 'system');
      player.items = ['небольшой нож','фляга','верёвка'];
      player.stats.str = ri(1,5);
      player.stats.agi = ri(1,5);
      player.stats.int = ri(1,5);
    }
    askRoleForPlayer(idx + 1);
    return;
  }

  addMsg(text, 'player', p.name);
  S.history.push({role:'user', content:`Игрок ${p.idx+1} (${p.role}, HP ${p.hp}/${p.maxHp}): ${text}`});

  if (S.pendingCheck) {
    addMsg(`Сначала брось кубик.`, 'system');
    showRollButton();
    return;
  }

  await sendToMaster(p, text);
}

async function sendToMaster(p, text){
  S.busy = true;
  const thinking = addMsg('Мастер думает...', 'thinking');
  try {
    const reply = await callLLM(S.history, 1200);
    thinking.remove();
    S.history.push({role:'assistant', content:reply});
    addMsg(reply, 'narrator');

    if (/(брось|бросить|кинь|проверк|d20|кубик)/i.test(reply)) {
      S.pendingCheck = 'd20';
      showRollButton();
    } else {
      S.currentTurn++;
      setTimeout(narrateScene, 700);
    }
  } catch(e){
    thinking.remove();
    addMsg('Мастер недоступен: ' + e.message, 'bad');
  }
  S.busy = false;
}

function showRollButton(){
  clearChoices();
  const c = $('#choices');
  c.style.display = 'flex';
  const b = document.createElement('button');
  b.className = 'rollBtn';
  b.textContent = '🎲 Бросить d20';
  b.onclick = async () => {
    clearChoices();
    const p = S.players[S.currentTurn % S.players.length];
    const roll = die(20);
    const mod = p.stats.str || 0;
    const total = roll + mod;
    addMsg(`🎲 d20: ${roll} + ${mod} = ${total}`, 'dice');
    S.history.push({role:'user', content:`Игрок ${p.idx+1} бросает d20: выпало ${roll} (модификатор ${mod}), итого ${total}. Опиши последствие.`});
    S.pendingCheck = null;
    await sendToMaster(p, '');
  };
  c.appendChild(b);
}

/* ---------- ИНИЦИАЛИЗАЦИЯ ---------- */
$('#sendBtn').onclick = handleInput;
$('#input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleInput(); }
});
$('#input').addEventListener('input', e => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight, 110) + 'px';
});

startScreen();
</script>
</body>

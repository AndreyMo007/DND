<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Перейти по ссылке</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffecd2, #fcb69f, #a1c4fd, #c2e9fb);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    overflow: hidden;
    font-family: 'Comic Sans MS', cursive, sans-serif;
  }

  @keyframes gradientBG {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .center-text {
    font-size: 4rem;
    color: #fff;
    text-shadow: 4px 4px 0 #ff6b6b, 8px 8px 0 #4ecdc4, 12px 12px 0 #ffe66d;
    text-align: center;
    z-index: 10;
    padding: 20px 40px;
    background: rgba(0, 0, 0, 0.2);
    border-radius: 30px;
    transform: rotate(-2deg);
    animation: wobble 3s ease-in-out infinite;
  }

  @keyframes wobble {
    0%, 100% { transform: rotate(-2deg) scale(1); }
    50%      { transform: rotate(2deg) scale(1.05); }
  }

  .clown {
    position: absolute;
    font-size: 3.5rem;
    animation: float 6s ease-in-out infinite;
    user-select: none;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-15deg); }
    50%      { transform: translateY(-35px) rotate(15deg); }
  }

  /* Позиции клоунов вокруг надписи */
  .c1 { top: 10%;  left: 10%;  animation-delay: 0s;   font-size: 3rem; }
  .c2 { top: 20%;  right: 15%; animation-delay: 1s;   font-size: 4rem; }
  .c3 { bottom: 15%; left: 20%; animation-delay: 2s;  font-size: 3.5rem; }
  .c4 { bottom: 25%; right: 10%; animation-delay: 0.5s; font-size: 3rem; }
  .c5 { top: 50%;  left: 5%;   animation-delay: 1.5s; font-size: 4.5rem; }
  .c6 { top: 60%;  right: 5%;  animation-delay: 2.5s; font-size: 3.5rem; }
  .c7 { top: 5%;   left: 40%;  animation-delay: 0.8s; font-size: 3rem; }
  .c8 { bottom: 5%; left: 45%; animation-delay: 1.8s; font-size: 4rem; }
  .c9 { top: 35%; left: 30%;  animation-delay: 3s;   font-size: 2.5rem; }
  .c10 { top: 40%; right: 30%; animation-delay: 0.3s; font-size: 2.8rem; }
</style>
</head>
<body>

  <!-- Смешная обстановка: летающие клоуны -->
  <div class="clown c1">🤡</div>
  <div class="clown c2">🤡</div>
  <div class="clown c3">🤡</div>
  <div class="clown c4">🤡</div>
  <div class="clown c5">🤡</div>
  <div class="clown c6">🤡</div>
  <div class="clown c7">🤡</div>
  <div class="clown c8">🤡</div>
  <div class="clown c9">🤡</div>
  <div class="clown c10">🤡</div>

  <!-- Надпись по центру -->
  <div class="center-text">
    Ну ты и ЛОХ!
  </div>

</body>
</html>
